{% extends 'base.html' %}
{% block title %}{{ title }} - Clinic System{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>{{ title }}</h1>
    <div class="actions"><a class="btn" href="{{ cancel_url }}">Cancel</a></div>
  </div>
  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert error">{{ form.non_field_errors }}</div>{% endif %}
      {% for field in form %}{% include 'partials/field.html' %}{% endfor %}
      <button class="btn primary" type="submit">{{ submit_label|default:"Save" }}</button>
    </form>
  </div>
{% endblock %}
